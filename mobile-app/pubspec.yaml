name: cybercheck_mobile
description: CyberCheck — Siber Güvenlik Mobil Uygulaması (Flutter/Dart)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── UI & Tipografi ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1          # Web tarafındaki Inter/JetBrains Mono tipografisi

  # ── Yönlendirme ────────────────────────────────────────────────
  go_router: ^14.2.7            # Bildirimsel sayfa yönlendirme

  # ── Backend & Auth ─────────────────────────────────────────────
  supabase_flutter: ^2.5.6      # Supabase Auth + Veritabanı entegrasyonu
  http: ^1.2.1                  # Backend REST API istekleri

  # ── Dosya & Medya İşlemleri ─────────────────────────────────────
  file_picker: ^8.0.7           # PDF, belge, dosya seçimi
  image_picker: ^1.1.2          # Ekran görüntüsü / galeri erişimi

  # ── PDF Raporlama ────────────────────────────────────────────────
  pdf: ^3.11.1                  # PDF belgesi oluşturma motoru
  printing: ^5.13.2             # PDF önizleme, paylaşma ve yazdırma

  # ── Ortam Değişkenleri ──────────────────────────────────────────
  flutter_dotenv: ^5.1.0        # .env dosyasından API anahtarlarını okuma

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Çevresel değişkenlerimize okuma izni veriyoruz
  assets:
    - .env
